[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-agents"
version = "1.0.0"
description = "Evidence-first, portable quality engineering agents"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.scripts]
quality-agents = "quality_agents.cli:main"

[tool.setuptools.packages.find]
include = ["quality_agents*"]

[tool.setuptools.package-data]
quality_agents = ["prompts/*.md", "demo_data/*", "demo_data/tests/*"]
